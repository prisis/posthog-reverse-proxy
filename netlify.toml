[[redirects]]
  from = "/ingest/static/*"
  to = "https://eu-assets.i.posthog.com/static/:splat"
  host = "eu-assets.i.posthog.com"
  status = 200
  force = true

[[redirects]]
  from = "/ingest/*"
  to = "https://eu.i.posthog.com/:splat"
  host = "eu.i.posthog.com"
  status = 200
  force = true

# Force all requests to https
[[redirects]]
  from = "http://*"
  to = "https://:splat"
  status = 301
  force = true
# Keep the proxy host out of search results: Google showed ph.anolilab.com/ in
# anolilab.com's results. Don't block it in robots.txt, or Google can't see this header.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
